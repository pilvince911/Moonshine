name: Moonshine Windows host
on:
  pull_request:
    branches: [moonshine/main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moonshine-host-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows-host:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BUILD_VERSION: 0.8.1
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Restore the pinned Windows source dependencies
        shell: pwsh
        run: |
          git submodule update --init --recursive --depth 1 -- third-party/build-deps third-party/Simple-Web-Server third-party/libdisplaydevice third-party/libvirtualdisplay third-party/libvirtualgamepad third-party/moonlight-common-c third-party/nanors third-party/nv-codec-headers third-party/nvapi third-party/nvapi-open-source-sdk third-party/ViGEmClient third-party/tray third-party/glad
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source dependency checkout failed.' }
      - uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda
        with:
          msystem: ucrt64
          update: true
          cache: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the Node toolchain
        shell: pwsh
        run: |
          'MOONSHINE_NODE_DIR=' + (Split-Path (Get-Command node).Source -Parent) >> $env:GITHUB_ENV
          'MOONSHINE_NPM=' + (Get-Command npm.cmd).Source >> $env:GITHUB_ENV
      - name: Configure the complete Windows host
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "$MOONSHINE_NODE_DIR"):$PATH"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF -DBUILD_TESTS=OFF \
            -DMOONSHINE_BUILD_INSTALLER=OFF \
            -DSUNSHINE_ENABLE_WEBRTC=OFF -DSUNSHINE_ENABLE_PYROWAVE=OFF \
            -DBUILD_SUNSHINE_VIRTUAL_DISPLAY_DRIVER=OFF \
            -DBUILD_VIRTUALDISPLAY_PROBE=OFF -DBUILD_VIRTUALDISPLAY_TOOLS=OFF \
            -DBUILD_VIRTUALDISPLAY_VULKAN_LAYER=OFF \
            -DSUNSHINE_BUNDLE_VHF_GAMEPAD_DRIVER=OFF \
            -DSUNSHINE_BUNDLE_USBIP_TRANSPORT=OFF \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME=Moonshine \
            -DSUNSHINE_PUBLISHER_WEBSITE=https://github.com/pilvince911/Moonshine \
            -DSUNSHINE_PUBLISHER_ISSUE_URL=https://github.com/pilvince911/Moonshine/issues \
            -DSUNSHINE_NPM_EXECUTABLE="$(cygpath -m "$MOONSHINE_NPM")"
      - name: Compile the integration translation units first
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "$MOONSHINE_NODE_DIR"):$PATH"
          cmake --build build --target CMakeFiles/sunshine.dir/src/main.cpp.obj CMakeFiles/sunshine.dir/src/confighttp_moonshine.cpp.obj CMakeFiles/sunshine.dir/src/moonshine/bridge_windows.cpp.obj --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Compile the host and its runtime helpers
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "$MOONSHINE_NODE_DIR"):$PATH"
          cmake --build build --target sunshine --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Record the build identity
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-evidence | Out-Null
          git rev-parse HEAD | Set-Content build-evidence/commit.txt
          git submodule status --recursive | Set-Content build-evidence/submodules.txt
          if (Test-Path build/CMakeCache.txt) { Copy-Item build/CMakeCache.txt build-evidence/ }
          if (Test-Path build/compile_commands.json) { Copy-Item build/compile_commands.json build-evidence/ }
          if (Test-Path build/CMakeFiles/CMakeConfigureLog.yaml) { Copy-Item build/CMakeFiles/CMakeConfigureLog.yaml build-evidence/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moonshine-windows-build-evidence
          path: build-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: moonshine-windows-native-build
          path: |
            build/sunshine.exe
            build/*.dll
            build/assets
            build/tools
          retention-days: 14
